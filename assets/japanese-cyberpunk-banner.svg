<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Japanese-inspired neon night city banner</title>
  <desc id="desc">A dark retro-futurist skyline with a rising neon sun, distant mountains, and a quiet grid, behind Red Angelo Panugaling's developer introduction.</desc>
