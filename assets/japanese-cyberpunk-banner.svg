      <stop offset="0" stop-color="#090b17"/>
      <stop offset="0.55" stop-color="#171027"/>
      <stop offset="1" stop-color="#32132e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9cbd"/>
      <stop offset="1" stop-color="#a855f7"/>
