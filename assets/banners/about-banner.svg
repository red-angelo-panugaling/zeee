  <text x="78" y="151" fill="#cbd5e1" font-family="Courier New,monospace" font-size="14" letter-spacing="1">A STUDENT BUILDING ONE PROJECT AT A TIME</text>
  <path d="M78 168h654" stroke="#f472b6" stroke-width="2"/>
  <text x="78" y="202" fill="#67e8f9" font-family="Courier New,monospace" font-size="12" letter-spacing="1">BS INFORMATION TECHNOLOGY  ·  DAVAO DEL SUR STATE COLLEGE  ·  PHILIPPINES</text>
  <text x="78" y="244" fill="#f9a8d4" font-family="Courier New,monospace" font-size="13" letter-spacing="1">01 / HOW I LEARN</text>
  <text x="78" y="271" fill="#e5e7eb" font-family="Arial,sans-serif" font-size="16">
    <tspan x="78" dy="0">Hey, I'm Red — a Bachelor of Science in Information Technology student at Davao del Sur</tspan>
    <tspan x="78" dy="23">State College. I like learning how software works by making things: small web projects,</tspan>
    <tspan x="78" dy="23">apps, and systems that solve practical problems.</tspan>
  </text>
  <text x="78" y="355" fill="#f9a8d4" font-family="Courier New,monospace" font-size="13" letter-spacing="1">02 / WHERE I'M HEADED</text>
  <text x="78" y="382" fill="#e5e7eb" font-family="Arial,sans-serif" font-size="16">
    <tspan x="78" dy="0">I'm working toward becoming a full-stack developer. Right now, I'm building my foundations</tspan>
    <tspan x="78" dy="23">in programming, web development, and databases, and getting better with every project.</tspan>
  </text>
  <path d="M78 435h92" stroke="#67e8f9" stroke-width="2"/><text x="186" y="440" fill="#9ca3af" font-family="Courier New,monospace" font-size="12">BUILD · LEARN · REPEAT</text>
